<!DOCTYPE html>
<!-- Aquí especifico que estoy utilizando HTML5 -->
<html lang="es">

<head>
    <!-- Acá defino cómo el navegador configurará mi documento -->
    <meta charset="UTF-8"> <!-- Con esto me aseguro de que las tildes y caracteres hispanos no se vean raros -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configuro esto para lograr un diseño "responsive" en celulares -->
    <title>CONTACTO</title> <!-- Este es el texto que se visualizará en la pestaña del navegador -->
</head>

<body>
    <!-- Organizo los enlaces internos de mi página en la etiqueta <nav> -->
    <nav>
        <!-- Combino <ul>, <button> y <a> para crear mis botones enlazados. El atributo 'href' le indica a la etiqueta 'a' (anchor) el destino a navegar -->
        <ul><button><a href="index.html">INICIO</a></button></ul>
        <ul><button><a href="sobre_mi.html">SOBRE MI</a></button></ul>
        <ul><button><a href="servicios.html">SERVICIOS</a></button></ul>
        <ul><button><a href="contacto.html">CONTACTO</a></button></ul>
        <ul><button><a href="formulario_basico.html">FORMULARIO</a></button></ul>
    </nav>

    <!-- Creo una sección para presentar el contacto -->
    <section>
        <div>
            <!-- Uso el encabezado <h1> para que este sea el título principal de la sección -->
            <h1>Contacto</h1>
        </div>
    </section>

    <!-- Abro una nueva sección para colocar mi información de contacto -->
    <section>
        <div>
            <!-- La etiqueta <p> la uso para escribir bloques de texto de manera ordenada (párrafos) -->
            <p>Email: juanpepito@gmail.com</p>
            <p>Teléfono: 3425123456</p>
            <p>Podés comunicarte conmigo a través de estos medios o completar el formulario de registro.</p>
            <!-- Aquí creo de un uso específico de botones: uso la etiqueta <button> de forma interactiva y le pongo un enlace <a> con un 'href' hacia mi archivo "formulario_basico.html" -->
            <button><a href="formulario_basico.html">FORMULARIO</a></button>
        </div>
    </section>

</body>

</html>

<!DOCTYPE html>
<!-- Aquí declaro que este documento usa la versión HTML5 -->
<html lang="es">

<head>
    <!-- Aquí guardo la configuración básica de mi página -->
    <meta charset="UTF-8"> <!-- Uso esto para evitar problemas con símbolos, acentos o letras como la ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusto cómo se ve la página en las pantallas de celulares -->
    <title>SERVICIOS</title> <!-- Este es el texto que pongo en la pestaña del navegador -->
</head>

<body>
    <!-- Creo la barra de navegación de mi sitio -->
    <nav>
        <!-- Uso <ul> para listar, <button> para que se vea clickeable en la interfaz, y <a> con href para definir hacia dónde me lleva el clic -->
        <ul><button><a href="index.html">INICIO</a></button></ul>
        <ul><button><a href="sobre_mi.html">SOBRE MI</a></button></ul>
        <ul><button><a href="servicios.html">SERVICIOS</a></button></ul>

        <ul><button><a href="formulario_basico.html">FORMULARIO</a></button></ul>
    </nav>

    <!-- Abro una sección principal para el título -->
    <section>
        <div>
            <!-- Utilizo el <h1> para definir el encabezado más importante de mi página -->
            <h1>Servicios 🛠️</h1>
        </div>
    </section>

    <!-- Creo otra sección para detallar cuáles son mis servicios -->
    <section>
        <div>
            <!-- Uso la etiqueta <ul> para crear una lista desordenada (Unordered List), que por defecto muestra viñetas/puntos. -->
            <!-- *Aclaración: Si usara <ol> (Ordered List), la lista estaría numerada automáticamente (1, 2, 3...). -->
            <ul>
                <!-- Uso la etiqueta <li> (List Item) para definir cada uno de los elementos concretos dentro de mi lista -->
                <li>Desarrollo de páginas web básicas</li>
                <li>Diseño de interfaces simples</li>
                <li>Mantenimiento de sitios web</li>

</body>

</html>

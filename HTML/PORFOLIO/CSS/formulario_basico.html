</head>

<body>
    <nav>
        <ul><button><a href="index.html">INICIO</a></button></ul>
        <ul><button><a href="servicios.html">SERVICIOS</a></button></ul>
        <ul><button><a href="sobre_mi.html">SOBRE MI</a></button></ul>
        <ul><button><a href="contacto.html">CONTACTO</a></button></ul>
        <ul><button><a href="formulario_basico.html">FORMULARIO BASICO</a></button></ul>
    </nav>

    <section>
        <div>
            <h1 class="tit_formulario"> FORMULARIO DE CONTACTO</h1>
        </div>
    </section>

    <section>
        <div>
            <form action="">
                <label for="nombre">nombre</label>
                <input type="text" id="nombre" name="nombre" required>
                <br>
                <label for="apellido">apellido</label>
                <input type="text" id="apellido" name="apellido" required>
                <br>
                <label for="email">email</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="telefono">telefono</label>
                <input type="tel" id="telefono" name="telefono" required>
                <br>
                <label for="edad">edad</label>
                <input type="number" id="edad" name="edad" required min="18" max="110">
                <br>
                <label for="contraseña">contraseña</label>
                <input type="password" id="contraseña" name="contraseña" required>
                <br>
                <button type="submit" style="background-color: red;">Enviar</button>
                <button type="reset">reset</button>
            </form>
        </div>
    </section>

</body>

</html>
